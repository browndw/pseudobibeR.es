name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Download UDPipe Spanish model for tests
        run: |
          Rscript -e "
          if (!dir.exists('tests/models')) dir.create('tests/models', recursive = TRUE)
          udpipe::udpipe_download_model(language = 'spanish-gsd', model_dir = 'tests/models')
          "

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Spanish spaCy integration in r-spacyr
        run: |
          python -m venv "$RUNNER_TEMP/r-spacyr"
          "$RUNNER_TEMP/r-spacyr/bin/python" -m pip install "spacy==3.8.7"
          "$RUNNER_TEMP/r-spacyr/bin/python" -m spacy download es_core_news_sm
          echo "RETICULATE_PYTHON=$RUNNER_TEMP/r-spacyr/bin/python" >> "$GITHUB_ENV"
          echo "PSEUDOBIBER_ES_SPACY_MODEL=es_core_news_sm" >> "$GITHUB_ENV"

      - name: Run Tests
        run: |
          devtools::test(stop_on_failure = TRUE, stop_on_warning = TRUE)
        shell: Rscript {0}
